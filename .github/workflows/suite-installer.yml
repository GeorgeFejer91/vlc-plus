name: Historical pinned-component installer check

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  suite:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build from pinned standalone installers
        shell: pwsh
        run: ./installer-suite/build.ps1
      - name: Fresh joint install and shortcut check
        shell: pwsh
        run: ./installer-suite/test-installer.ps1 -InstallerPath build/suite-release/01_VLCPlus_and_LSL_Recorder_Setup_0.3.3_x64.exe
      - name: Preserve install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-evidence
          path: build/suite-evidence/
          if-no-files-found: ignore
      - name: Three installers and matching sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-release
          path: build/suite-release/
          compression-level: 0
