name: Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested 0.3.2 experimental installer from main
        type: boolean
        default: false
  push:
    branches: ['codex/windows-installer']
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make diffutils patch autoconf automake libtool gettext-devel pkgconf
            mingw-w64-x86_64-gcc mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-winextras mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libgcrypt mingw-w64-x86_64-gettext-tools
      - name: Build and package
        shell: pwsh
        run: ./build-windows.ps1 -MsysRoot '${{ steps.msys.outputs.msys2-location }}' -Jobs 2
      - name: Fresh installed-player check
        shell: pwsh
        run: ./scripts/test-installer.ps1 -InstallerPath build/stock-vlc-package/out/VLC_Plus_Setup_0.3.2_x64.exe
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-diagnostics
          path: |
            build/windows-build.log
            build/toolchain-packages.txt
            build/vlc-native/config.log
            build/validation/**/installer-check.json
            build/validation/**/installed-probe.json
            build/validation/**/integrity.json
            build/validation/**/post-run-integrity.json
            build/validation/**/player.log
            build/validation/**/install.log
          if-no-files-found: ignore
      - name: Installer and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vlc-plus-windows-x64
          path: |
            build/stock-vlc-package/out/*.exe
            build/stock-vlc-package/out/*.zip
            build/stock-vlc-package/out/build-receipt.json
            build/stock-vlc-package/stage/manifest.json
            build/stock-vlc-package/stage/source/vlc-plus-source.zip
            build/toolchain-packages.txt
  publish:
    needs: installer
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact tested release inputs
        run: |
          gh run download "$GITHUB_RUN_ID" --name vlc-plus-windows-x64 --dir candidate
          gh run download "$GITHUB_RUN_ID" --name native-build-diagnostics --dir diagnostics
          python scripts/prepare-release.py --candidate candidate --diagnostics diagnostics --source-commit "$GITHUB_SHA" --output release
      - name: Publish experimental installer and sources
        run: |
          existing_tag=$(git ls-remote --tags origin refs/tags/v0.3.2-experimental.1)
          test -z "$existing_tag"
          gh release create v0.3.2-experimental.1 release/* --target "$GITHUB_SHA" --prerelease --title "VLC+ 0.3.2 - Alt+F affect arrows" --notes-file docs/release-notes.md
