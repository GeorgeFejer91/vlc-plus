name: Standalone source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-key-routing:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-qt5-base mingw-w64-x86_64-pkgconf
      - name: Own native video message loop and teardown
        shell: pwsh
        run: ./vlc-qt/test-native-keys.ps1 -QtBin '${{ steps.msys.outputs.msys2-location }}/mingw64/bin'
  recorder:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.25.0'
      - name: Embedded Recorder source and UI
        shell: pwsh
        run: ./build-recorder.ps1 -CheckOnly
      - name: VLC+ website and self-contained controller
        run: |
          node scripts/build-site.mjs
          node scripts/test-site-safety.mjs
          node scripts/check-site.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: embedded-recorder-ui
          path: |
            recorder/.for-ai-local/record-and-play/
            recorder/.for-ai-local/external-tabs/
            build/site-ui/
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Source and provenance
        run: python scripts/check-source.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @('package-stock-vlc.ps1', 'build-windows.ps1') + @(Get-ChildItem vlc-qt,scripts,installer-suite -Filter '*.ps1' | ForEach-Object FullName)
          foreach ($script in $scripts) {
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Joint launcher
        shell: pwsh
        run: ./installer-suite/test-launcher.ps1
      - name: Source-built release boundary
        run: python installer-suite/test-source-release.py
      - name: Recorder NSIS payload identity
        run: python scripts/test-recorder-payload.py
      - name: Rust bridge
        run: cargo test --locked --manifest-path vlc-qt/bridge/Cargo.toml
      - name: For-AI context
        shell: pwsh
        run: ./for-ai/scripts/check-context.ps1 -ProjectRoot .

  qt-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev
      - name: Build and check panel offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/panel-check/assets/face
          cp assets/face/photo-*.png build/panel-check/assets/face/
          g++ -std=c++11 -fPIC -O1 -Ivlc-qt vlc-qt/panel-check.cpp $(pkg-config --cflags --libs Qt5Widgets Qt5Gui Qt5Core Qt5Test) -o build/panel-check/panel-check
          build/panel-check/panel-check examples/planner-appearance.v1.json build/panel-check/panel-check.png
